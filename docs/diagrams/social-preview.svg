<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" width="1280" height="640" viewBox="0 0 1280 640">
  <defs>
    <style>
      .sans   { font-family: 'Segoe UI', 'Helvetica Neue', Helvetica, Arial, sans-serif; }
      .plabel { font-size: 14px; font-weight: 700; letter-spacing: 1.5px; }
      .ptitle { font-size: 24px; font-weight: 700; }
      .ptech  { font-size: 17px; }
    </style>
  </defs>

  <!-- Background -->
  <rect width="1280" height="640" fill="#0F1A2B"/>

  <!-- Top colour strip (one segment per phase) -->
  <rect x="0"   y="0" width="320" height="10" fill="#5B7290"/>
  <rect x="320" y="0" width="320" height="10" fill="#2EC4B6"/>
  <rect x="640" y="0" width="320" height="10" fill="#F7941D"/>
  <rect x="960" y="0" width="320" height="10" fill="#E35D4F"/>

  <!-- Eyebrow -->
  <text x="71" y="80" class="sans" font-size="16" font-weight="700"
        letter-spacing="4" fill="#2EC4B6">REFERENCE ARCHITECTURE</text>

  <!-- Title -->
  <text x="71" y="142" class="sans" font-size="54" font-weight="700" fill="#FFFFFF">
    Enterprise Data Platform Evolution
  </text>
  <rect x="71" y="162" width="190" height="5" rx="2.5" fill="#F7941D"/>

  <!-- Subtitle -->
  <text x="71" y="222" class="sans" font-size="24" fill="#E3EAF4">
    4-Phase Modernization Blueprint<tspan fill="#6F8299"> | </tspan>Batch → Real-Time → Azure Lakehouse
  </text>

  <!-- Phase 1 -->
  <rect x="71" y="275" width="250" height="190" rx="12" fill="#5B7290"/>
  <text x="196" y="315" text-anchor="middle" class="sans plabel" fill="#E3EAF4">PHASE 1</text>
  <text x="196" y="355" text-anchor="middle" class="sans ptitle" fill="#FFFFFF">Batch Lake</text>
  <text x="196" y="400" text-anchor="middle" class="sans ptech"  fill="#FFFFFF">Spark + Hive</text>
  <text x="196" y="428" text-anchor="middle" class="sans ptech"  fill="#FFFFFF">Airflow</text>

  <!-- Phase 2 -->
  <rect x="367" y="275" width="250" height="190" rx="12" fill="#2EC4B6"/>
  <text x="492" y="315" text-anchor="middle" class="sans plabel" fill="#0F1A2B">PHASE 2</text>
  <text x="492" y="355" text-anchor="middle" class="sans ptitle" fill="#0F1A2B">Multi-Source</text>
  <text x="492" y="400" text-anchor="middle" class="sans ptech"  fill="#0F1A2B">Identity resolution</text>
  <text x="492" y="428" text-anchor="middle" class="sans ptech"  fill="#0F1A2B">Data quality gates</text>

  <!-- Phase 3 -->
  <rect x="663" y="275" width="250" height="190" rx="12" fill="#F7941D"/>
  <text x="788" y="315" text-anchor="middle" class="sans plabel" fill="#0F1A2B">PHASE 3</text>
  <text x="788" y="355" text-anchor="middle" class="sans ptitle" fill="#0F1A2B">Lambda</text>
  <text x="788" y="400" text-anchor="middle" class="sans ptech"  fill="#0F1A2B">Kafka + Spark Streaming</text>
  <text x="788" y="428" text-anchor="middle" class="sans ptech"  fill="#0F1A2B">Batch reconciliation</text>

  <!-- Phase 4 (target state, highlighted) -->
  <rect x="959" y="275" width="250" height="190" rx="12" fill="#E35D4F"
        stroke="#F5C26B" stroke-width="3"/>
  <text x="1084" y="315" text-anchor="middle" class="sans plabel" fill="#FFE9E6">PHASE 4</text>
  <text x="1084" y="355" text-anchor="middle" class="sans ptitle" fill="#FFFFFF">Cloud Lakehouse</text>
  <text x="1084" y="400" text-anchor="middle" class="sans ptech"  fill="#FFFFFF">Databricks + Delta Lake</text>
  <text x="1084" y="428" text-anchor="middle" class="sans ptech"  fill="#FFFFFF">Unity Catalog</text>

  <!-- Arrows -->
  <path d="M336,358 L352,370 L336,382 z" fill="#FFFFFF"/>
  <path d="M632,358 L648,370 L632,382 z" fill="#FFFFFF"/>
  <path d="M928,358 L944,370 L928,382 z" fill="#FFFFFF"/>

  <!-- Divider -->
  <line x1="71" y1="510" x2="1209" y2="510" stroke="#FFFFFF" stroke-opacity="0.18" stroke-width="1"/>

  <!-- Footer -->
  <text x="71" y="563" class="sans" font-size="20" fill="#9FB3CC">
    Data Platform Architecture Portfolio — Sri Adilakshmi Marrivada
  </text>
  <text x="1209" y="563" text-anchor="end" class="sans" font-size="18" fill="#6F8299">
    13 ADRs | NFRs | Risk register
  </text>
</svg>